  - 'Wymieniono wydział: Wydział Geologii, Geofizyki i Ochrony Środowiska.'
  - 'Zawarto pełną nazwę uczelni: Akademia Górniczo-Hutnicza im. Stanisława Staszica w Krakowie.'
