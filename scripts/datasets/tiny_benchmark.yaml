- question: Jakie są zasady odbywania praktyk zawodowych na Wydziale Metali Nieżelaznych oraz jakie są wymagania dotyczące
    ich organizacji?
  answer: Praktyki zawodowe na I stopniu kształcenia na Wydziale Metali Nieżelaznych trwają obowiązkowo 4 tygodnie i są przewidziane
    na 6 semestrze. Zaleca się, aby praktyki odbywały się w okresie wolnym od zajęć dydaktycznych. Opiekun praktyk, powołany
    przez Dziekana, organizuje miejsca praktyk w zakładach przemysłowych. Student ma również możliwość samodzielnego znalezienia
    miejsca praktyki, które musi być zatwierdzone przez opiekuna. Praktyki mogą być realizowane w krajowych i zagranicznych
    zakładach, instytucjach publicznych i niepublicznych związanych z kierunkiem studiów. Pomiędzy zakładem pracy a wydziałem
    podpisywane jest porozumienie, a student przedstawia opiekunowi plan praktyki, który wymaga akceptacji kierownictwa zakładu.
    Po zakończeniu praktyki student musi przedstawić sprawozdanie, na podstawie którego praktyka jest zaliczana.
  evaluation_criteria:
    - W odpowiedzi podano, że praktyki trwają 4 tygodnie.
    - Wskazano, że praktyki są przewidziane na 6 semestrze.
    - Zalecenie dotyczące odbywania praktyk w okresie wolnym od zajęć dydaktycznych zostało uwzględnione.
    - Opiekun praktyk jest powoływany przez Dziekana i organizuje miejsca praktyk.
    - Podano, że student może samodzielnie znaleźć miejsce praktyki, które musi być zatwierdzone.
    - Wymieniono konieczność przedstawienia sprawozdania po zakończeniu praktyki.
  source_url: https://sylabusy.agh.edu.pl/public/api/education-program-document/show/25-rcm-ii-n-14
  source_ref: pdf_page_6

- question: W jakim roku powstala Akademia Gorniczo Hutnicza w Krakowie?
  answer: AGH zostala powolana w 1919 roku.
  evaluation_criteria:
    - Wspomniano rok 1919.
    - Jasno powiedziano, ze chodzi o zalozenie AGH.
- question: Jakie są warunki skorzystania z uprawnień do uzyskania punktów dodatkowych w rekrutacji na AGH?
  answer: Aby skorzystać z uprawnień do uzyskania punktów dodatkowych w rekrutacji na AGH, należy dokonać rejestracji w systemie
    e-Rekrutacja oraz przedstawić zaświadczenie poświadczające osiągnięcie lub aktywność w okresie przeznaczonym na składanie
    deklaracji przystąpienia do kwalifikacji na studia w danym cyklu rekrutacyjnym.
  evaluation_criteria:
  - W odpowiedzi podano, że konieczna jest rejestracja w systemie e-Rekrutacja.
  - Wymieniono konieczność przedstawienia zaświadczenia poświadczającego osiągnięcie lub aktywność.
  - Wskazano, że zaświadczenie musi być dostarczone w określonym okresie składania deklaracji.
  source_url: https://rekrutacja.agh.edu.pl/punkty-dodatkowe/
  source_ref: html_chunk_2
- question: Jakie są zasady dotyczące badań lekarskich dla studentów I roku na AGH?
  answer: Badania lekarskie dla studentów I roku na AGH można zrealizować nieodpłatnie w wybranych przychodniach, na podstawie
    skierowania otrzymanego z Centrum Rekrutacji AGH. Szczegóły dotyczące przychodni dostępne są na stronie http://www.bhp.agh.edu.pl/kandydaci/wykaz-przychodni/.
    W pozostałych Poradniach Medycyny Pracy badania te mogą być wykonane, ale odpłatnie. Uzyskane zaświadczenie o braku przeciwwskazań
    zdrowotnych do podjęcia studiów należy dostarczyć do Dziekanatu Wydziału prowadzącego dany kierunek.
  evaluation_criteria:
  - W odpowiedzi wskazano, że badania lekarskie są realizowane na podstawie skierowania z Centrum Rekrutacji AGH.
  - Podano, że badania są nieodpłatne w wybranych przychodniach oraz odpłatne w pozostałych.
  - Wymieniono konieczność dostarczenia zaświadczenia do Dziekanatu Wydziału.
  source_url: https://rekrutacja.agh.edu.pl/punkty-dodatkowe/
  source_ref: html_chunk_3
