- question: Jakie są główne działy regulaminu pracy AGH i jakie tematy są w nich poruszane?
  answer: Regulamin pracy AGH składa się z pięciu głównych działów. Dział I zawiera postanowienia ogólne (§ 1-3). Dział II
    dotyczy praw i obowiązków pracodawcy oraz pracownika, w tym obowiązków pracodawcy (§ 6) oraz uprawnień pracodawcy (§ 7-12).
    Dział III koncentruje się na czasie pracy (§ 40-71b), a Dział IV na wypłacie wynagrodzenia za pracę (§ 72-75). Ostatni,
    Dział V, odnosi się do dyscypliny pracy (§ 76-81).
  evaluation_criteria:
  - Wymieniono wszystkie pięć głównych działów regulaminu.
  - Podano konkretne numery paragrafów dla każdego działu.
  - Wskazano tematy poruszane w każdym dziale.
  source_url: https://www.agh.edu.pl/home/ckim/dokumenty/regulaminy/r_pracy/Regulamin_Pracy_AGH_-_Zalacznik_1_do_Zarzadzenia_51_2025_Rektora.pdf
  source_ref: pdf_page_2
- question: Jakie są różne systemy czasu pracy wymienione w regulaminie AGH i jakie są ich numery paragrafów?
  answer: Regulamin AGH wymienia kilka systemów czasu pracy. System podstawowy opisany jest w paragrafach § 57-58, system
    równoważny w § 59-64, system zadaniowy w § 65, system skróconego tygodnia pracy w § 66, system pracy weekendowej w § 67,
    a ruchomy czas pracy w § 68. Dodatkowo, indywidualny rozkład czasu pracy jest opisany w § 69, a praca w porze nocnej w
    § 70.
  evaluation_criteria:
  - Wymieniono wszystkie systemy czasu pracy.
  - Podano numery paragrafów dla każdego systemu.
  - Zidentyfikowano różne formy organizacji czasu pracy.
  source_url: https://www.agh.edu.pl/home/ckim/dokumenty/regulaminy/r_pracy/Regulamin_Pracy_AGH_-_Zalacznik_1_do_Zarzadzenia_51_2025_Rektora.pdf
  source_ref: pdf_page_2
- question: Jakie są prawa i obowiązki pracodawcy w zakresie bezpieczeństwa i higieny pracy oraz ochrony przeciwpożarowej
    w AGH?
  answer: Prawa i obowiązki pracodawcy w zakresie bezpieczeństwa i higieny pracy oraz ochrony przeciwpożarowej są opisane
    w Rozdziale I Działu VI regulaminu. Obejmują one zapewnienie odpowiednich warunków pracy, które minimalizują ryzyko wypadków
    oraz zagrożeń dla zdrowia pracowników. Pracodawca ma również obowiązek informować pracowników o zagrożeniach oraz organizować
    szkolenia w zakresie bhp i ppoż.
  evaluation_criteria:
  - W odpowiedzi wymieniono prawa i obowiązki pracodawcy.
  - Podano, że regulamin odnosi się do minimalizacji ryzyka wypadków.
  - Wskazano na obowiązek informowania pracowników o zagrożeniach.
  source_url: https://www.agh.edu.pl/home/ckim/dokumenty/regulaminy/r_pracy/Regulamin_Pracy_AGH_-_Zalacznik_1_do_Zarzadzenia_51_2025_Rektora.pdf
  source_ref: pdf_page_3
